<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enxoval Isabela & Ramon 🤍</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    body { 
      background-color: #f8fafc; 
      color: #1e293b; 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
    }
    .font-serif-title {
      font-family: 'Playfair Display', Georgia, serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- Topo Fixo Estilizado White -->
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 pt-4 pb-3">
      
      <!-- Cabeçalho Casal -->
      <div class="flex justify-between items-start mb-4">
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-widest text-emerald-600 block mb-0.5">Checklist da Casa Nova</span>
          <h1 class="text-2xl font-bold text-slate-900 font-serif-title flex items-center gap-2">
            Isabela <span class="text-emerald-500 text-lg">&amp;</span> Ramon
          </h1>
        </div>
        <span id="status-sync" class="text-xs px-3 py-1 rounded-full bg-slate-100 border border-slate-200 text-slate-500 font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-spinner fa-spin text-slate-400"></i> Conectando...
        </span>
      </div>

      <!-- Card de Progresso -->
      <div class="bg-gradient-to-r from-slate-50 to-emerald-50/40 p-3.5 rounded-2xl border border-slate-200/90 shadow-inner">
        <div class="flex justify-between items-center text-xs font-semibold mb-2">
          <span class="text-slate-600 flex items-center gap-1.5">
            <i class="fa-solid fa-chart-pie text-emerald-600"></i> Progresso do Nosso Lar
          </span>
          <span id="progress-text" class="text-emerald-700 bg-emerald-100/80 px-2.5 py-0.5 rounded-full font-bold">0% (0/0)</span>
        </div>
        <div class="w-full bg-slate-200/80 rounded-full h-2.5 overflow-hidden">
          <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Abas de Cômodos -->
      <div id="category-tabs" class="flex gap-2 overflow-x-auto no-scrollbar mt-3.5 pt-0.5">
        <button onclick="setCategory('Todos')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition">Todos</button>
        <button onclick="setCategory('Cozinha')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">🍳 Cozinha</button>
        <button onclick="setCategory('Sala')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">🛋️ Sala</button>
        <button onclick="setCategory('Quarto')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">🛏️ Quarto</button>
        <button onclick="setCategory('Banheiro')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">🚿 Banheiro</button>
        <button onclick="setCategory('Lavanderia')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">🧺 Lavanderia</button>
        <button onclick="setCategory('Outros')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">🛠️ Outros</button>
      </div>

      <!-- Busca e Filtro -->
      <div class="flex gap-2 mt-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="search-input" oninput="renderItems()" placeholder="Buscar item (ex: Airfryer, Toalha)..." class="w-full bg-slate-100/80 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-emerald-500 transition">
        </div>
        <select id="filter-status" onchange="renderItems()" class="bg-slate-100/80 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 focus:outline-none focus:bg-white focus:border-emerald-500">
          <option value="all">Todos</option>
          <option value="pending">Falta comprar</option>
          <option value="bought">Já temos</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Lista de Itens -->
  <main class="max-w-2xl mx-auto p-4">
    <div id="items-list" class="space-y-2.5"></div>

    <!-- Rodapé de Ferramentas -->
    <div class="mt-12 pt-6 border-t border-slate-200 text-center">
      <p class="text-xs text-slate-400 mb-3">Quer carregar todos os 100 itens da casa vazia?</p>
      <button onclick="loadFullList()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-slate-900 shadow-sm transition">
        <i class="fa-solid fa-wand-magic-sparkles text-emerald-500"></i> Carregar / Resetar Lista Completa (100 Itens)
      </button>
    </div>
  </main>

  <!-- Botão Flutuante (+) -->
  <div class="fixed bottom-6 right-6 z-30">
    <button onclick="openModal()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold w-14 h-14 rounded-2xl shadow-xl shadow-slate-900/20 flex items-center justify-center text-xl transition transform active:scale-95">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- Modal Adicionar / Editar Item -->
  <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white border border-slate-100 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
      <h2 id="modal-title" class="text-lg font-bold text-slate-900 mb-4">Novo Item do Enxoval</h2>
      <input type="hidden" id="edit-id">
      <div class="space-y-3.5">
        <div>
          <label class="text-xs font-semibold text-slate-500 block mb-1">Nome do Item</label>
          <input type="text" id="new-name" placeholder="Ex: Jogo de Panelas, Cortina..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:bg-white focus:border-emerald-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 block mb-1">Cômodo</label>
          <select id="new-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:bg-white focus:border-emerald-500">
            <option value="Cozinha">🍳 Cozinha</option>
            <option value="Sala">🛋️ Sala</option>
            <option value="Quarto">🛏️ Quarto</option>
            <option value="Banheiro">🚿 Banheiro</option>
            <option value="Lavanderia">🧺 Lavanderia</option>
            <option value="Outros">🛠️ Outros</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 block mb-1">Observação / Marca / Preço (Opcional)</label>
          <input type="text" id="new-notes" placeholder="Ex: Inox, Cor preta, R$ 350..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:bg-white focus:border-emerald-500">
        </div>
      </div>
      <div class="flex gap-2.5 mt-6">
        <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold transition">Cancelar</button>
        <button onclick="saveItem()" class="w-1/2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow-md shadow-emerald-600/20 transition">Salvar</button>
      </div>
    </div>
  </div>

    onValue(itemsRef, (snapshot) => {
      const statusEl = document.getElementById('status-sync');
      statusEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i> Sincronizado';
      
      const data = snapshot.val();
      if (!data) {
        fullHouseItems.forEach(item => push(itemsRef, item));
        return;
      }
      allItems = data;
      renderItems();
    }, (error) => {
      document.getElementById('status-sync').innerHTML = '<span class="text-red-500">Erro de permissão</span>';
      console.error(error);
    });

    window.renderItems = function() {
      const listEl = document.getElementById('items-list');
      const search = document.getElementById('search-input').value.toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      listEl.innerHTML = '';

      const entries = Object.entries(allItems || {});
      
      const total = entries.length;
      const boughtCount = entries.filter(([_, item]) => item.bought).length;
      const pct = total > 0 ? Math.round((boughtCount / total) * 100) : 0;
      document.getElementById('progress-text').innerText = `${pct}% (${boughtCount}/${total})`;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      const filtered = entries.filter(([id, item]) => {
        const matchCat = currentCategory === 'Todos' || item.category === currentCategory;
        const matchSearch = item.name.toLowerCase().includes(search) || (item.notes && item.notes.toLowerCase().includes(search));
        const matchStatus = statusFilter === 'all' || (statusFilter === 'bought' && item.bought) || (statusFilter === 'pending' && !item.bought);
        return matchCat && matchSearch && matchStatus;
      });

      filtered.sort((a, b) => Number(a[1].bought) - Number(b[1].bought));

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border border-slate-100">Nenhum item encontrado neste filtro.</div>`;
        return;
      }

      filtered.forEach(([id, item]) => {
        const card = document.createElement('div');
        card.className = `flex items-center justify-between p-3.5 rounded-2xl border transition shadow-sm ${
          item.bought 
            ? 'bg-slate-50 border-slate-200/60 opacity-65' 
            : 'bg-white border-slate-200/90 hover:border-emerald-300'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3.5 flex-1 cursor-pointer" onclick="toggleItem('${id}', ${!item.bought})">
            <div class="w-6 h-6 rounded-lg flex items-center justify-center border-2 transition shrink-0 ${
              item.bought ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-slate-50'
            }">
              ${item.bought ? '<i class="fa-solid fa-check text-xs font-bold"></i>' : ''}
            </div>
            <div class="pr-2">
              <p class="text-sm font-semibold ${item.bought ? 'line-through text-slate-400' : 'text-slate-800'}">${item.name}</p>
              <div class="flex flex-wrap items-center gap-1.5 mt-1">
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${item.category}</span>
                ${item.notes ? `<span class="text-xs text-slate-500">• ${item.notes}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="openEditModal('${id}')" class="text-slate-400 hover:text-slate-700 p-2 text-xs transition" title="Editar">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="deleteItem('${id}')" class="text-slate-400 hover:text-red-500 p-2 text-xs transition" title="Excluir">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });
    };

    window.toggleItem = function(id, newState) {
      update(ref(db, `itens_enxoval/${id}`), { bought: newState });
    };

    window.saveItem = function() {
      const editId = document.getElementById('edit-id').value;
      const name = document.getElementById('new-name').value.trim();
      const category = document.getElementById('new-category').value;
      const notes = document.getElementById('new-notes').value.trim();
      if (!name) return;

      if (editId) {
        update(ref(db, `itens_enxoval/${editId}`), { name, category, notes });
      } else {
        push(itemsRef, { name, category, notes, bought: false });
      }
      closeModal();
    };

    window.openEditModal = function(id) {
      const item = allItems[id];
      if (!item) return;
      document.getElementById('modal-title').innerText = 'Editar Item';
      document.getElementById('edit-id').value = id;
      document.getElementById('new-name').value = item.name;
      document.getElementById('new-category').value = item.category;
      document.getElementById('new-notes').value = item.notes || '';
      document.getElementById('modal').classList.remove('hidden');
    };

    window.deleteItem = function(id) {
      if (confirm('Deseja remover este item da lista?')) {
        remove(ref(db, `itens_enxoval/${id}`));
      }
    };

    window.loadFullList = function() {
      if (confirm('Isso vai substituir a lista atual pelos 100 itens completos de casa nova. Confirmar?')) {
        set(itemsRef, null).then(() => {
          fullHouseItems.forEach(item => push(itemsRef, item));
        });
      }
    };

    window.setCategory = function(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.innerText.includes(cat)) {
          btn.className = "cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition";
        } else {
          btn.className = "cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition";
        }
      });
      renderItems();
    };

    window.openModal = () => {
      document.getElementById('modal-title').innerText = 'Novo Item do Enxoval';
      document.getElementById('edit-id').value = '';
      document.getElementById('new-name').value = '';
      document.getElementById('new-notes').value = '';
      document.getElementById('modal').classList.remove('hidden');
    };
    window.closeModal = () => document.getElementById('modal').classList.add('hidden');
  </script>
</body>
</html>
