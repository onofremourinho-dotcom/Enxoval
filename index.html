<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enxoval Isabela & Ramon 🤍</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body { 
      background-color: #faf9f6; 
      background-image: radial-gradient(#e5e7eb 0.8px, transparent 0.8px);
      background-size: 20px 20px;
      color: #1e293b; 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
    }
    .font-serif-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- Cabeçalho Decorado -->
  <header class="bg-white/95 backdrop-blur-md border-b border-stone-200/80 shadow-sm sticky top-0 z-20">
    <!-- Faixa decorativa superior -->
    <div class="h-1.5 w-full bg-gradient-to-r from-emerald-600 via-teal-500 to-amber-400"></div>

    <div class="max-w-2xl mx-auto px-4 pt-4 pb-3">
      
      <!-- Topo: Monograma + Nomes + Status -->
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3.5">
          <!-- Monograma do Casal -->
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-50 to-amber-50 border border-emerald-200/70 flex flex-col items-center justify-center shadow-sm shrink-0">
            <span class="font-serif-title text-lg font-bold text-emerald-800 leading-none">I<span class="text-amber-500 font-normal">&amp;</span>R</span>
            <i class="fa-solid fa-heart text-[8px] text-rose-400 mt-1"></i>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-700 bg-emerald-50 border border-emerald-200/60 px-2 py-0.5 rounded-full">Nosso Lar</span>
              <span class="text-xs text-amber-500">✨</span>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 font-serif-title tracking-wide leading-tight mt-0.5">
              Isabela <span class="text-emerald-600 italic font-normal">&amp;</span> Ramon
            </h1>
          </div>
        </div>

        <span id="status-sync" class="text-[11px] px-3 py-1 rounded-full bg-stone-100 border border-stone-200 text-stone-500 font-medium flex items-center gap-1.5 shadow-inner">
          <i class="fa-solid fa-spinner fa-spin text-stone-400"></i> Conectando
        </span>
      </div>

      <!-- Painel de Progresso Decorado -->
      <div class="bg-gradient-to-br from-white via-stone-50/50 to-emerald-50/40 p-4 rounded-2xl border border-stone-200/90 shadow-sm">
        <div class="grid grid-cols-3 gap-2 mb-3 text-center">
          <div class="bg-white p-2 rounded-xl border border-stone-100 shadow-sm">
            <span class="block text-[10px] uppercase tracking-wider text-stone-400 font-semibold">Total</span>
            <span id="stat-total" class="text-base font-bold text-slate-800">0</span>
          </div>
          <div class="bg-emerald-50/70 p-2 rounded-xl border border-emerald-100 shadow-sm">
            <span class="block text-[10px] uppercase tracking-wider text-emerald-700 font-semibold">Já Temos</span>
            <span id="stat-bought" class="text-base font-bold text-emerald-600">0</span>
          </div>
          <div class="bg-amber-50/70 p-2 rounded-xl border border-amber-100 shadow-sm">
            <span class="block text-[10px] uppercase tracking-wider text-amber-700 font-semibold">Faltam</span>
            <span id="stat-pending" class="text-base font-bold text-amber-600">0</span>
          </div>
        </div>

        <div class="flex justify-between items-center text-xs font-semibold mb-1.5">
          <span class="text-stone-600 flex items-center gap-1.5">
            <i class="fa-solid fa-house-chimney-heart text-emerald-600"></i> Evolução do Enxoval
          </span>
          <span id="progress-text" class="text-emerald-800 bg-emerald-100 px-2.5 py-0.5 rounded-full font-bold">0%</span>
        </div>
        <div class="w-full bg-stone-200/80 rounded-full h-2.5 overflow-hidden p-0.5">
          <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 via-teal-500 to-amber-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Abas de Cômodos com Contador -->
      <div id="category-tabs" class="flex gap-2 overflow-x-auto no-scrollbar mt-3.5 pt-0.5">
        <button onclick="setCategory('Todos')" data-cat="Todos" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition">✨ Todos</button>
        <button onclick="setCategory('Cozinha')" data-cat="Cozinha" class="cat-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-stone-200 hover:bg-stone-50 transition">🍳 Cozinha</button>
        <button onclick="setCategory('Sala')" data-cat="Sala" class="cat-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-stone-200 hover:bg-stone-50 transition">🛋️ Sala</button>
        <button onclick="setCategory('Quarto')" data-cat="Quarto" class="cat-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-stone-200 hover:bg-stone-50 transition">🛏️ Quarto</button>
        <button onclick="setCategory('Banheiro')" data-cat="Banheiro" class="cat-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-stone-200 hover:bg-stone-50 transition">🚿 Banheiro</button>
        <button onclick="setCategory('Lavanderia')" data-cat="Lavanderia" class="cat-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-stone-200 hover:bg-stone-50 transition">🧺 Lavanderia</button>
        <button onclick="setCategory('Outros')" data-cat="Outros" class="cat-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-stone-200 hover:bg-stone-50 transition">🛠️ Casa &amp; Outros</button>
      </div>

      <!-- Busca e Filtro -->
      <div class="flex gap-2 mt-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-xs"></i>
          <input type="text" id="search-input" oninput="renderItems()" placeholder="Buscar item no enxoval..." class="w-full bg-stone-100/90 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-sm text-slate-800 placeholder-stone-400 focus:outline-none focus:bg-white focus:border-emerald-500 transition">
        </div>
        <select id="filter-status" onchange="renderItems()" class="bg-stone-100/90 border border-stone-200 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 focus:outline-none focus:bg-white focus:border-emerald-500">
          <option value="all">Todos</option>
          <option value="pending">Falta comprar</option>
          <option value="bought">Já temos</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Lista de Itens -->
  <main class="max-w-2xl mx-auto p-4">
    <div id="items-list" class="space-y-2.5"></div>

    <!-- Rodapé Decorado + Botão de Resetar sem Duplicar -->
    <div class="mt-14 pt-8 pb-4 border-t border-stone-200/80 text-center">
      <div class="inline-flex items-center gap-2 text-stone-400 text-xs font-serif-title italic text-base mb-3">
        <span>✦</span> Construindo o nosso lar <span>✦</span>
      </div>
      <p class="text-xs text-stone-400 mb-3">Se a lista estiver duplicada ou quiser recarregar os 165 itens originais:</p>
      <button onclick="loadFullList()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold bg-white border border-stone-300 text-slate-700 hover:bg-emerald-50 hover:border-emerald-300 hover:text-emerald-800 shadow-sm transition">
        <i class="fa-solid fa-rotate text-emerald-600"></i> Limpar Duplicados e Carregar 165 Itens
      </button>
    </div>
  </main>

  <!-- Botão Flutuante (+) -->
  <div class="fixed bottom-6 right-6 z-30">
    <button onclick="openModal()" class="bg-gradient-to-tr from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold w-14 h-14 rounded-2xl shadow-xl shadow-emerald-600/30 flex items-center justify-center text-xl transition transform active:scale-95">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- Modal Adicionar / Editar Item -->
  <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white border border-stone-100 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
      <h2 id="modal-title" class="text-xl font-bold text-slate-900 font-serif-title mb-4">Novo Item do Enxoval</h2>
      <input type="hidden" id="edit-id">
      <div class="space-y-3.5">
        <div>
          <label class="text-xs font-semibold text-stone-500 block mb-1">Nome do Item</label>
          <input type="text" id="new-name" placeholder="Ex: Jogo de Panelas, Cortina..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:bg-white focus:border-emerald-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-stone-500 block mb-1">Cômodo</label>
          <select id="new-category" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:bg-white focus:border-emerald-500">
            <option value="Cozinha">🍳 Cozinha</option>
            <option value="Sala">🛋️ Sala</option>
            <option value="Quarto">🛏️ Quarto</option>
            <option value="Banheiro">🚿 Banheiro</option>
            <option value="Lavanderia">🧺 Lavanderia</option>
            <option value="Outros">🛠️ Casa &amp; Outros</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-stone-500 block mb-1">Observação / Marca / Preço (Opcional)</label>
          <input type="text" id="new-notes" placeholder="Ex: Inox, Cor preta, R$ 350..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:bg-white focus:border-emerald-500">
        </div>
      </div>
      <div class="flex gap-2.5 mt-6">
        <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600 text-sm font-semibold transition">Cancelar</button>
        <button onclick="saveItem()" class="w-1/2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow-md shadow-emerald-600/20 transition">Salvar</button>
      </div>
    </div>
  </div>

    // Converte a lista num objeto único para salvar de uma vez sem duplicar
    function getInitialDataObject() {
      const obj = {};
      fullHouseItems.forEach((item, index) => {
        const key = 'item_' + String(index + 1).padStart(3, '0');
        obj[key] = item;
      });
      return obj;
    }

    onValue(itemsRef, (snapshot) => {
      if (isResetting) return;

      const statusEl = document.getElementById('status-sync');
      statusEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i> Sincronizado';
      
      const data = snapshot.val();
      if (!data) {
        isResetting = true;
        set(itemsRef, getInitialDataObject()).then(() => {
          isResetting = false;
        });
        return;
      }
      allItems = data;
      updateCategoryCounts();
      renderItems();
    }, (error) => {
      document.getElementById('status-sync').innerHTML = '<span class="text-red-500">Erro de permissão</span>';
      console.error(error);
    });

    function updateCategoryCounts() {
      const entries = Object.values(allItems || {});
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const cat = btn.getAttribute('data-cat');
        const style = categoryStyles[cat];
        if (cat === 'Todos') {
          btn.innerHTML = `✨ Todos (${entries.length})`;
        } else {
          const count = entries.filter(i => i.category === cat).length;
          const label = cat === 'Outros' ? 'Casa & Outros' : cat;
          btn.innerHTML = `${style ? style.icon : ''} ${label} (${count})`;
        }
      });
    }

    window.renderItems = function() {
      const listEl = document.getElementById('items-list');
      const search = document.getElementById('search-input').value.toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      listEl.innerHTML = '';

      const entries = Object.entries(allItems || {});
      
      const total = entries.length;
      const boughtCount = entries.filter(([_, item]) => item.bought).length;
      const pendingCount = total - boughtCount;
      const pct = total > 0 ? Math.round((boughtCount / total) * 100) : 0;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-bought').innerText = boughtCount;
      document.getElementById('stat-pending').innerText = pendingCount;
      document.getElementById('progress-text').innerText = `${pct}% concluído`;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      const filtered = entries.filter(([id, item]) => {
        const matchCat = currentCategory === 'Todos' || item.category === currentCategory;
        const matchSearch = item.name.toLowerCase().includes(search) || (item.notes && item.notes.toLowerCase().includes(search));
        const matchStatus = statusFilter === 'all' || (statusFilter === 'bought' && item.bought) || (statusFilter === 'pending' && !item.bought);
        return matchCat && matchSearch && matchStatus;
      });

      filtered.sort((a, b) => Number(a[1].bought) - Number(b[1].bought));

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-12 text-stone-400 text-sm bg-white rounded-2xl border border-stone-200/80 shadow-sm">
            <i class="fa-solid fa-box-open text-2xl mb-2 text-stone-300 block"></i>
            Nenhum item encontrado neste filtro.
          </div>`;
        return;
      }

      filtered.forEach(([id, item]) => {
        const style = categoryStyles[item.category] || categoryStyles["Outros"];
        const card = document.createElement('div');
        card.className = `flex items-center justify-between p-3.5 rounded-2xl border transition duration-200 shadow-sm ${
          item.bought 
            ? 'bg-emerald-50/30 border-emerald-200/60 opacity-70' 
            : 'bg-white border-stone-200/90 hover:border-emerald-400 hover:shadow-md'
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3.5 flex-1 cursor-pointer" onclick="toggleItem('${id}', ${!item.bought})">
            <div class="w-6 h-6 rounded-xl flex items-center justify-center border-2 transition shrink-0 ${
              item.bought ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm shadow-emerald-500/30' : 'border-stone-300 bg-stone-50/80'
            }">
              ${item.bought ? '<i class="fa-solid fa-check text-xs font-bold"></i>' : ''}
            </div>
            <div class="pr-2">
              <p class="text-sm font-semibold leading-snug ${item.bought ? 'line-through text-stone-400' : 'text-slate-800'}">${item.name}</p>
              <div class="flex flex-wrap items-center gap-1.5 mt-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${style.badge}">${style.icon} ${item.category}</span>
                ${item.notes ? `<span class="text-xs text-stone-500">• ${item.notes}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="openEditModal('${id}')" class="text-stone-400 hover:text-emerald-600 p-2 text-xs transition" title="Editar">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="deleteItem('${id}')" class="text-stone-400 hover:text-rose-500 p-2 text-xs transition" title="Excluir">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });
    };

    window.toggleItem = function(id, newState) {
      update(ref(db, `itens_enxoval/${id}`), { bought: newState });
    };

    window.saveItem = function() {
      const editId = document.getElementById('edit-id').value;
      const name = document.getElementById('new-name').value.trim();
      const category = document.getElementById('new-category').value;
      const notes = document.getElementById('new-notes').value.trim();
      if (!name) return;

      if (editId) {
        update(ref(db, `itens_enxoval/${editId}`), { name, category, notes });
      } else {
        push(itemsRef, { name, category, notes, bought: false });
      }
      closeModal();
    };

    window.openEditModal = function(id) {
      const item = allItems[id];
      if (!item) return;
      document.getElementById('modal-title').innerText = 'Editar Item';
      document.getElementById('edit-id').value = id;
      document.getElementById('new-name').value = item.name;
      document.getElementById('new-category').value = item.category;
      document.getElementById('new-notes').value = item.notes || '';
      document.getElementById('modal').classList.remove('hidden');
    };

    window.deleteItem = function(id) {
      if (confirm('Deseja remover este item da lista?')) {
        remove(ref(db, `itens_enxoval/${id}`));
      }
    };

    window.loadFullList = function() {
      if (confirm('Isso vai limpar os itens duplicados e carregar exatamente os 165 itens da casa nova. Confirmar?')) {
        isResetting = true;
        set(itemsRef, getInitialDataObject()).then(() => {
          isResetting = false;
        });
      }
    };

    window.setCategory = function(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition";
        } else {
          btn.className = "cat-btn shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-stone-200 hover:bg-stone-50 transition";
        }
      });
      renderItems();
    };

    window.openModal = () => {
      document.getElementById('modal-title').innerText = 'Novo Item do Enxoval';
      document.getElementById('edit-id').value = '';
      document.getElementById('new-name').value = '';
      document.getElementById('new-notes').value = '';
      document.getElementById('modal').classList.remove('hidden');
    };
    window.closeModal = () => document.getElementById('modal').classList.add('hidden');
  </script>
